<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聖經金句輕鬆讀</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <div class="header-icon">✦</div>
      <h1 class="site-title">聖經金句輕鬆讀</h1>
      <p class="site-subtitle">在生命的每個時刻，找到適合您的聖經話語</p>
    </div>
  </header>

  <main class="site-main">
    <div class="container">

      <section class="filter-panel" aria-label="篩選條件">
        <div class="filter-row">
          <div class="filter-group">
            <h2 class="filter-heading">選擇難度</h2>
            <div class="difficulty-options" id="difficulty-options" role="radiogroup" aria-label="難度選擇"></div>
          </div>
          <div class="filter-group filter-group--themes">
            <h2 class="filter-heading">選擇主題 <span class="hint">（可多選）</span></h2>
            <div class="theme-grid" id="theme-grid" role="group" aria-label="主題選擇，可多選"></div>
          </div>
        </div>
        <div class="filter-actions">
          <button class="btn btn-primary" id="search-btn" type="button">
            <span>尋找金句</span>
            <span class="count-badge" id="count-badge"></span>
          </button>
          <button class="btn btn-secondary" id="random-btn" type="button">✦ 隨機推薦</button>
        </div>
      </section>

      <section class="results-area" id="results-area" aria-live="polite" aria-label="搜尋結果"></section>

    </div>
  </main>

  <aside class="info-drawer" id="info-drawer" role="dialog" aria-modal="true" aria-label="背景資訊" aria-hidden="true">
    <div class="drawer-header">
      <h2 class="drawer-title">📖 背景資訊</h2>
      <button class="drawer-close" id="drawer-close-btn" aria-label="關閉" type="button">✕</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>
  <div class="backdrop" id="backdrop" aria-hidden="true"></div>

  <footer class="site-footer">
    <div class="container">
      <p>聖經版本：和合本（簡體）· 資料來源：bible-api.com · 僅供個人靈修使用</p>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="bible.js"></script>
  <script src="app.js"></script>
</body>
</html>
